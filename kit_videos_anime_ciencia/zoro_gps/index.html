<!doctype html>
<html><head><meta charset="utf-8"><title>Zoro y el GPS</title>
<style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2) format("woff2");}
@font-face{font-family:Mont;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2) format("woff2");}
@font-face{font-family:Oswald;font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2) format("woff2");}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:absolute;left:0;top:0}
#ui>div{position:absolute;left:0;right:0;text-align:center;opacity:0;pointer-events:none}
.title{top:62px;font:150px/1 Anton,Impact;color:#ff3346;letter-spacing:4px;
  text-shadow:0 0 6px #ff6170,0 0 22px #ff1a35,0 0 48px #c8001a,0 6px 0 #4a0008}
.pill{top:236px}.lab{top:1688px}
.pill span,.lab span{display:inline-block;font:700 50px/1 Oswald,Impact;letter-spacing:2px;color:#fff;padding:12px 30px 14px;
  border:4px solid #fff;border-radius:16px;background:rgba(10,10,16,.78);text-transform:uppercase}
.y span{color:#ffd23f;border-color:#ffd23f}.r span{color:#ff4a5a;border-color:#ff4a5a}.b span{color:#6fd3ff;border-color:#6fd3ff}
.sub{top:1500px;font:900 76px/1.05 Mont,Impact;color:#fff;padding:0 50px;text-transform:uppercase;letter-spacing:1px}
.sub span{display:inline-block;margin:0 10px;transform-origin:50% 70%}
.big{top:300px;font:190px/1 Anton,Impact;color:#ffd23f;letter-spacing:3px}
.kanji{top:330px;font:900 250px/1 "Yu Gothic UI","Yu Gothic","Meiryo","MS Gothic",sans-serif;color:#ff2d40;
  text-shadow:0 0 10px #ff6b78,0 0 34px #ff0022,0 0 70px #b0001a}
.stamp{top:360px}.stamp span{display:inline-block;font:110px/1 Anton,Impact;color:#ff3346;border:10px solid #ff3346;border-radius:14px;padding:6px 30px;transform:rotate(-9deg);background:rgba(20,0,4,.55)}
.cnt{top:1688px;left:auto!important;right:60px!important;text-align:right!important}
.cnt span{display:inline-block;font:700 58px/1 Oswald;color:#ffd23f;border:4px solid #ffd23f;border-radius:14px;padding:8px 24px;background:rgba(10,10,16,.8)}
.badge{top:250px;left:50px!important;right:auto!important;text-align:left!important;font:700 56px/1 Oswald;color:#fff;letter-spacing:1px;text-transform:uppercase;text-shadow:0 4px 0 #000,0 0 12px #000}
.badge b{display:inline-flex;align-items:center;justify-content:center;width:86px;height:86px;border-radius:50%;background:#e0283a;border:5px solid #fff;margin-right:20px;font:68px Anton;vertical-align:middle}
.meter{top:1688px}.meter .box{display:inline-block;width:640px;height:56px;border:4px solid #fff;border-radius:14px;background:rgba(10,10,16,.8);position:relative;overflow:hidden;vertical-align:middle}
.meter .fill{position:absolute;left:0;top:0;bottom:0;width:15%;background:#3aa8ff}
.meter i{font:700 40px Oswald;color:#fff;font-style:normal;margin-right:18px;vertical-align:middle}
</style></head>
<body>
<div id="stage">
  <svg id="root" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="ui"></div>
</div>
<script src="gsap.min.js"></script>
<script src="chars.js"></script>
<script src="words.js"></script>
<script src="anim.js"></script>
</body></html>
