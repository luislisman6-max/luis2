<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(../fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Mont;src:url(../fonts/montserrat-latin-900-normal.woff2)}
body{margin:0;background:#0b0b10;width:1440px}
h1{font:64px Anton;color:#ffd23a;text-align:center;margin:30px 0 6px;letter-spacing:3px;text-shadow:0 0 18px #ff9a1f}
#grid{display:grid;grid-template-columns:repeat(3,480px)}
.lab{text-align:center;padding:6px 0 22px;background:#0b0b10}
.lab b{font:34px Anton;color:#fff;letter-spacing:2px}
.lab i{display:block;font:15px Mont;font-style:normal;color:#f2c94c;letter-spacing:1px;margin-top:2px}
</style></head><body><h1>ZORO Y EL GPS · PERSONAJES</h1><div id="grid"></div>
<script src="../chars.js"></script><script>
const defs=`<defs><radialGradient id="spot" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#ffe8b0" stop-opacity=".22"/><stop offset=".6" stop-color="#ffe8b0" stop-opacity=".04"/><stop offset="1" stop-opacity="0"/></radialGradient>
<radialGradient id="floor" cx="50%" cy="50%"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-opacity="0"/></radialGradient>
<clipPath id="clipR"><rect x="214" y="-100" width="300" height="400"/></clipPath></defs>`;
const g=document.getElementById('grid');
for(const c of CHARS){
 g.insertAdjacentHTML('beforeend',`<div class="card"><svg id="${c.id}" width="480" height="720" viewBox="-40 -60 480 720">${defs}
 <rect x="-40" y="-60" width="480" height="720" fill="${c.bg}"/><polygon points="140,-60 260,-60 400,640 0,640" fill="url(#spot)"/>
 <ellipse cx="200" cy="622" rx="120" ry="16" fill="url(#floor)"/>${c.svg()}</svg><div class="lab"><b>${c.name}</b><i>${c.sub}</i></div></div>`);
}
</script></body></html>
